services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: loja-pedidos-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "${SQLSERVER_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

  api:
    image: ghcr.io/vitoriamaira/loja-pedidos-api:latest
    container_name: loja-pedidos-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      Cors__AllowedOrigins__0: "http://localhost:5056"

      ConnectionStrings__lojapedidos: "Server=sqlserver,1433;Database=lojapedidos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped

  web:
    image: ghcr.io/vitoriamaira/loja-pedidos-web:latest
    container_name: loja-pedidos-web

    ports:
      - "${WEB_PORT:-5056}:80"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  sqlserver-data: